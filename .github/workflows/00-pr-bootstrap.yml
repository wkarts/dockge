name: 00 · PR Bootstrap Gate

on:
  pull_request:
    branches: [develop, main]

permissions:
  contents: read

concurrency:
  group: dockge-bootstrap-pr-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run check-ts
      - run: npm run lint
      - run: npm run build:frontend
      - name: Proteger Native Agents do Dockge
        run: node ./extra/check-agent-boundaries.mjs
      - name: Independência operacional
        shell: bash
        run: |
          set -euo pipefail
          patterns='github\.com/louislam/dockge|raw\.githubusercontent\.com/louislam/dockge|dockge\.kuma\.pet|hub\.docker\.com/r/louislam/dockge|louislam/dockge:'
          operational_paths=(
            README.md compose.yaml package.json
            backend common frontend extra deploy docker
            .github/workflows
          )
          if grep -RInE "$patterns" \
            --exclude='00-ci.yml' \
            --exclude='00-pr-bootstrap.yml' \
            "${operational_paths[@]}"; then
            echo 'Referências operacionais ao projeto antigo ainda existem.' >&2
            exit 20
          fi

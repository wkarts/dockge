name: 05 · JSON YAML Validate

on:
  push:
    branches: [develop, main]
  pull_request:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockge-json-yaml-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Validar JSON e YAML
        uses: GrantBirki/json-yaml-validate@v2.6.1
        with:
          comment: "false"
          exclude_file: ".github/config/exclude.txt"

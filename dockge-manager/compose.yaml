services:
  postgres:
    image: postgres:17-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: dockge_manager
      POSTGRES_USER: dockge_manager
      POSTGRES_PASSWORD: ${DOCKGE_MANAGER_DB_PASSWORD:?configure DOCKGE_MANAGER_DB_PASSWORD}
    volumes:
      - dockge_manager_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U dockge_manager -d dockge_manager"]
      interval: 10s
      timeout: 5s
      retries: 10

  manager:
    image: ${DOCKGE_MANAGER_IMAGE:-ghcr.io/wkarts/dockge-manager}:${DOCKGE_MANAGER_TAG:-latest}
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
    ports:
      - ${DOCKGE_MANAGER_BIND_HOST:-127.0.0.1}:${DOCKGE_MANAGER_PORT:-8010}:8000
    environment:
      DOCKGE_MANAGER_DATABASE_URL: postgresql+psycopg://dockge_manager:${DOCKGE_MANAGER_DB_PASSWORD}@postgres:5432/dockge_manager
      DOCKGE_MANAGER_JWT_SECRET: ${DOCKGE_MANAGER_JWT_SECRET:?configure DOCKGE_MANAGER_JWT_SECRET}
      DOCKGE_MANAGER_FERNET_KEY: ${DOCKGE_MANAGER_FERNET_KEY:?configure DOCKGE_MANAGER_FERNET_KEY}
      DOCKGE_MANAGER_ADMIN_EMAIL: ${DOCKGE_MANAGER_ADMIN_EMAIL:-admin@localhost}
      DOCKGE_MANAGER_ADMIN_PASSWORD: ${DOCKGE_MANAGER_ADMIN_PASSWORD:?configure DOCKGE_MANAGER_ADMIN_PASSWORD}
      DOCKGE_MANAGER_ALLOW_HTTP_TARGETS: ${DOCKGE_MANAGER_ALLOW_HTTP_TARGETS:-false}
    security_opt:
      - no-new-privileges:true
    read_only: true
    tmpfs:
      - /tmp
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 10

volumes:
  dockge_manager_postgres:

name: 69 · Bootstrap ecosystem source

on:
  push:
    branches: [feat/dockge-manager-deploy-v1]
    paths:
      - 'extra/ecosystem-source.tar.gz.b64.part-*'
      - 'extra/materialize-ecosystem.py'
      - '.github/workflows/69-bootstrap-ecosystem-source.yml'

permissions:
  contents: write

concurrency:
  group: dockge-ecosystem-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Verify and materialize ecosystem source
        run: python extra/materialize-ecosystem.py
      - name: Commit materialized source
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/69-bootstrap-ecosystem-source.yml
          rm -f extra/materialize-ecosystem.py
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet && exit 0
          git commit -m 'feat(ecosystem): implement Dockge Manager and Deploy 0.1.0 [skip release]'
          git push origin HEAD:feat/dockge-manager-deploy-v1

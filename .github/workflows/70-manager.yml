name: 70 · Dockge Manager

on:
  pull_request:
    branches: [main]
    paths:
      - 'dockge-manager/**'
      - '.github/workflows/70-manager.yml'
  push:
    branches: [main]
    paths:
      - 'dockge-manager/**'
      - '.github/workflows/70-manager.yml'
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dockge-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Backend dependencies
        run: pip install -r dockge-manager/requirements-dev.txt
      - name: Backend tests
        env:
          PYTHONPATH: dockge-manager/backend
        run: |
          python -m compileall -q dockge-manager/backend dockge-manager/migrations
          pytest -q dockge-manager/backend/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Frontend build
        working-directory: dockge-manager/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Architecture guards
        shell: bash
        run: |
          set -euo pipefail
          # A documentação pode mencionar docker.sock para explicar a proibição;
          # runtime, compose, backend e frontend não podem depender dele.
          ! grep -RIn '/var/run/docker.sock' \
            dockge-manager/compose.yaml \
            dockge-manager/Dockerfile \
            dockge-manager/backend \
            dockge-manager/frontend/src
          grep -RIn '/api/v1/automation' dockge-manager/README.md >/dev/null
      - name: Build image smoke test
        run: docker build -f dockge-manager/Dockerfile dockge-manager -t dockge-manager:test

  image:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(tr -d '[:space:]' < dockge-manager/VERSION)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Manager image
        uses: docker/build-push-action@v6
        with:
          context: dockge-manager
          file: dockge-manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/dockge-manager:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/dockge-manager:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/dockge-manager:sha-${{ steps.meta.outputs.short_sha }}
          provenance: true
          sbom: true

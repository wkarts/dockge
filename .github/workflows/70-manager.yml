name: 70 · Dockge Manager

on:
  pull_request:
    branches: [main]
    paths:
      - 'dockge-manager/**'
      - '.github/workflows/70-manager.yml'
  push:
    branches: [main]
    paths:
      - 'dockge-manager/**'
      - '.github/workflows/70-manager.yml'
  workflow_dispatch:

permissions:
  contents: write
  packages: write

concurrency:
  group: dockge-manager-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Backend dependencies
        run: pip install -r dockge-manager/requirements-dev.txt
      - name: Backend tests
        env:
          PYTHONPATH: dockge-manager/backend
        run: |
          python -m compileall -q dockge-manager/backend dockge-manager/migrations
          pytest -q dockge-manager/backend/tests
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
      - name: Frontend build
        working-directory: dockge-manager/frontend
        run: |
          npm install --no-audit --no-fund
          npm run build
      - name: Architecture guards
        shell: bash
        run: |
          set -euo pipefail
          ! grep -RIn '/var/run/docker.sock' \
            dockge-manager/compose.yaml \
            dockge-manager/Dockerfile \
            dockge-manager/backend \
            dockge-manager/frontend/src
          ! grep -RInE 'backend/agent-|agent-manager|common/agent-socket' \
            dockge-manager/backend \
            dockge-manager/frontend/src \
            dockge-manager/compose.yaml
          grep -n '/api/v1/automation' dockge-manager/backend/app/dockge_client.py >/dev/null
          grep -n 'follow_redirects=False' dockge-manager/backend/app/dockge_client.py >/dev/null
          test -s dockge-manager/migrations/versions/0002_deployment_safety.py
      - name: Build image smoke test
        run: docker build -f dockge-manager/Dockerfile dockge-manager -t dockge-manager:test

  image:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: validate
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolve metadata
        id: meta
        shell: bash
        run: |
          set -euo pipefail
          echo "version=$(tr -d '[:space:]' < dockge-manager/VERSION)" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Publish Manager image
        uses: docker/build-push-action@v6
        with:
          context: dockge-manager
          file: dockge-manager/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/dockge-manager:${{ steps.meta.outputs.version }}
            ghcr.io/${{ steps.meta.outputs.owner }}/dockge-manager:latest
            ghcr.io/${{ steps.meta.outputs.owner }}/dockge-manager:sha-${{ steps.meta.outputs.short_sha }}
          provenance: true
          sbom: true
      - name: Publish independent Manager release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          VERSION: ${{ steps.meta.outputs.version }}
          IMAGE_OWNER: ${{ steps.meta.outputs.owner }}
        shell: bash
        run: |
          set -euo pipefail
          tag="dockge-manager-v$VERSION"
          cat > /tmp/dockge-manager-release.md <<EOF
          Dockge Manager $VERSION

          Imagem multiarch:
          ghcr.io/$IMAGE_OWNER/dockge-manager:$VERSION

          Management plane independente do Dockge Core, com FastAPI, PostgreSQL/Alembic, Vue PWA, múltiplos Dockge Targets, deployments verificados, snapshots, auditoria e rollback.
          EOF
          if gh release view "$tag" >/dev/null 2>&1; then
            gh release edit "$tag" --title "Dockge Manager $VERSION" --notes-file /tmp/dockge-manager-release.md
          else
            gh release create "$tag" --target "$GITHUB_SHA" --title "Dockge Manager $VERSION" --notes-file /tmp/dockge-manager-release.md
          fi
          gh release view "$tag" --json tagName --jq '.tagName' | grep -Fxq "$tag"

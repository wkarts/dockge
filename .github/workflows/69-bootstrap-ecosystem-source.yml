name: 69 · Bootstrap ecosystem source

on:
  push:
    branches: [feat/dockge-manager-deploy-v1]
    paths:
      - 'extra/ecosystem-bootstrap.tar.gz'
      - '.github/workflows/69-bootstrap-ecosystem-source.yml'

permissions:
  contents: write

concurrency:
  group: dockge-ecosystem-bootstrap-${{ github.ref }}
  cancel-in-progress: false

jobs:
  materialize:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - name: Materialize project source
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf extra/ecosystem-bootstrap.tar.gz -C .
          rm -f extra/ecosystem-bootstrap.tar.gz
          rm -f .github/workflows/69-bootstrap-ecosystem-source.yml
          rm -f .github/workflows/98-clean-v160-agent-assets.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          if git diff --cached --quiet; then
            echo 'Nenhuma alteração para materializar.'
            exit 0
          fi
          git commit -m 'feat(ecosystem): implement Dockge Manager and Deploy 1.0'
          git push origin HEAD:feat/dockge-manager-deploy-v1

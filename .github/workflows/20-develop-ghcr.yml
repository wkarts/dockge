name: 20 · GHCR develop

on:
  pull_request:
    branches: [develop]
  push:
    branches: [develop]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

concurrency:
  group: dockge-develop-image-${{ github.ref }}
  cancel-in-progress: true

jobs:
  image:
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    steps:
      - name: Exigir develop no disparo manual
        if: ${{ github.event_name == 'workflow_dispatch' && github.ref != 'refs/heads/develop' }}
        shell: bash
        run: |
          echo 'A publicação manual de homologação só pode ser executada na branch develop.' >&2
          exit 2
      - uses: actions/checkout@v4
      - uses: docker/setup-qemu-action@v3
      - uses: docker/setup-buildx-action@v3
      - name: Resolver metadados da imagem
        id: meta
        shell: bash
        run: |
          echo "short_sha=${GITHUB_SHA:0:12}" >> "$GITHUB_OUTPUT"
          echo "owner=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_OUTPUT"
      - name: Autenticar no GHCR
        if: ${{ github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build de teste em PR e publicação somente em develop
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          target: release
          platforms: linux/amd64,linux/arm64
          push: ${{ github.ref == 'refs/heads/develop' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch') }}
          tags: |
            ghcr.io/${{ steps.meta.outputs.owner }}/dockge:develop
            ghcr.io/${{ steps.meta.outputs.owner }}/dockge:develop-${{ steps.meta.outputs.short_sha }}
          provenance: true
          sbom: true

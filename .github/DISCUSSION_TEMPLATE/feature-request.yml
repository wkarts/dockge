labels: [feature-request]
body:
  - type: checkboxes
    id: no-duplicate
    attributes:
      label: "⚠️ Verifique se a proposta já existe."
      description: "Pesquise nas discussões e Pull Requests de wkarts/dockge."
      options:
        - label: "Pesquisei e não encontrei proposta equivalente"
          required: true
  - type: dropdown
    id: feature-area
    attributes:
      label: "🏷️ Área"
      multiple: true
      options:
        - API / Automation
        - Generic Infrastructure Agent
        - Docker / Compose
        - UI / UX
        - Security
        - CI / Release / GHCR
        - Other
    validations:
      required: true
  - type: textarea
    id: feature-description
    validations:
      required: true
    attributes:
      label: "🔖 Proposta"
      description: "Descreva claramente a capacidade desejada e o problema que ela resolve."
  - type: textarea
    id: solution
    validations:
      required: true
    attributes:
      label: "✔️ Solução sugerida"
      description: "Explique o comportamento esperado."
  - type: textarea
    id: security-scope
    validations:
      required: false
    attributes:
      label: "🔐 Impacto de segurança/escopo"
      description: "Para automação remota, explique scopes, namespace e auditoria necessários."
  - type: textarea
    id: additional-context
    validations:
      required: false
    attributes:
      label: "📝 Contexto adicional"

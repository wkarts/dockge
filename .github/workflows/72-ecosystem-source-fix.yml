name: 72 · Ecosystem source fix

on:
  push:
    branches: [feat/dockge-manager-deploy-v1]
    paths:
      - '.github/workflows/72-ecosystem-source-fix.yml'
      - 'dockge-manager/backend/app/api.py'
      - 'dockge-deploy/go.mod'
      - 'dockge-deploy/go.sum'

permissions:
  contents: write

concurrency:
  group: dockge-ecosystem-source-fix-${{ github.ref }}
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Normalize Manager route and Deploy modules
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path('dockge-manager/backend/app/api.py')
          text = path.read_text()
          old = '@router.delete("/targets/{target_id}", status_code=204)'
          new = '@router.delete("/targets/{target_id}", status_code=204, response_model=None)'
          if old in text:
              text = text.replace(old, new, 1)
              path.write_text(text)
          elif new not in text:
              raise SystemExit('target DELETE route marker not found')
          PY
          cd dockge-deploy
          go mod tidy
          go test ./...
          go vet ./...
          cd ..
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add dockge-manager/backend/app/api.py dockge-deploy/go.mod dockge-deploy/go.sum
          if git diff --cached --quiet; then
            echo 'Source already normalized.'
            exit 0
          fi
          git commit -m 'fix(ecosystem): normalize Manager 204 route and Deploy modules [skip release]'
          git push origin HEAD:feat/dockge-manager-deploy-v1

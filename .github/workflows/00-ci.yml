name: 00 · CI

on:
  pull_request:
    branches: [develop, main]
  push:
    branches: [develop, main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: dockge-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.16.0'
          cache: npm
      - run: npm ci
      - run: npm run check-ts
      - run: npm run lint
      - run: npm run test:security
      - run: npm run build:frontend
      - name: Validar contrato API-first
        run: |
          test -s VERSION
          test -s backend/api/api-token-auth.ts
          test -s backend/api/api-idempotency-store.ts
          test -s backend/api/stack-file-store.ts
          test -s backend/routers/api-v1-router.ts
          test -s deploy/compose.api-first.yaml
          grep -q '/api/v1/automation' backend/routers/api-v1-router.ts
          grep -q 'idempotency-key' backend/routers/api-v1-router.ts
          grep -q 'DOCKGE_API_IDEMPOTENCY_FILE' deploy/compose.api-first.yaml
          grep -q 'new ApiV1Router' backend/routers/main-router.ts
          test -s backend/totp.ts
          test -s backend/socket-handlers/twofa-socket-handler.ts
      - name: Proteger Native Agents do Dockge
        run: node ./extra/check-agent-boundaries.mjs
      - name: Garantir retirada do Agent externo legado
        shell: bash
        run: |
          set -euo pipefail
          test ! -e infrastructure-agent
          test ! -e .github/workflows/30-agent-build.yml
          test ! -e .github/workflows/55-agent-assets.yml
          test ! -e .github/workflows/60-agent-release.yml
          test ! -e docs/contracts/control-plane-agent-api.md
      - name: Garantir independência operacional
        shell: bash
        run: |
          set -euo pipefail
          patterns='github\.com/louislam/dockge|raw\.githubusercontent\.com/louislam/dockge|dockge\.kuma\.pet|hub\.docker\.com/r/louislam/dockge|louislam/dockge:'
          operational_paths=(
            README.md compose.yaml package.json
            backend common frontend extra deploy docker
            .github/workflows
          )
          if grep -RInE "$patterns" \
            --exclude='00-ci.yml' \
            --exclude='00-pr-bootstrap.yml' \
            "${operational_paths[@]}"; then
            echo 'Foram encontradas referências operacionais ao projeto antigo.' >&2
            exit 20
          fi
          grep -q 'github.com/wkarts/dockge' README.md
          grep -q 'ghcr.io/wkarts/dockge' compose.yaml
          ! grep -RInE 'branches:[[:space:]]*\[master\]|refs/heads/master' \
            --exclude='00-ci.yml' \
            --exclude='00-pr-bootstrap.yml' \
            .github/workflows

labels: [help]
body:
  - type: checkboxes
    id: no-duplicate-issues
    attributes:
      label: "⚠️ Verifique se a dúvida já foi registrada."
      description: "Pesquise neste repositório antes de abrir uma nova discussão."
      options:
        - label: "Pesquisei e não encontrei uma discussão equivalente"
          required: true
  - type: checkboxes
    attributes:
      label: "🛡️ Política de Segurança"
      description: Vulnerabilidades não devem ser descritas publicamente.
      options:
        - label: Li a política em https://github.com/wkarts/dockge/security/policy
          required: true
  - type: textarea
    id: problem
    validations:
      required: true
    attributes:
      label: "📝 Descreva sua dúvida ou problema"
      description: "Informe o cenário, o que tentou e o resultado observado."
  - type: textarea
    id: error-msg
    validations:
      required: false
    attributes:
      label: "📝 Mensagens de erro ou logs"
  - type: input
    id: dockge-version
    attributes:
      label: "Dockge Version"
      description: "Informe a versão SemVer instalada, não apenas latest/develop."
      placeholder: "Ex. 1.6.0"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: "💻 Sistema operacional e arquitetura"
      placeholder: "Ex. Ubuntu 24.04 amd64"
    validations:
      required: true
  - type: input
    id: docker-version
    attributes:
      label: "🐋 Docker / Compose"
      placeholder: "Ex. Docker 28 / Compose v2"
    validations:
      required: false

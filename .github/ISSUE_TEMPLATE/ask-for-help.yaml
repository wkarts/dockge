name: "⚠️ Ajuda / suporte"
description: "Use Discussions para dúvidas de uso; Issues são destinadas a bugs reproduzíveis."
body:
  - type: markdown
    attributes:
      value: |
        Para dúvidas de uso, utilize as Discussions deste projeto quando estiverem habilitadas:
        https://github.com/wkarts/dockge/discussions

        Para um bug reproduzível, volte e escolha o template de Bug Report.
  - type: checkboxes
    id: understood
    attributes:
      label: "Canal correto"
      options:
        - label: "Entendi que Issues devem conter bugs reproduzíveis"
          required: true

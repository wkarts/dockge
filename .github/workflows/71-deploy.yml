name: 71 · Dockge Deploy binaries

on:
  pull_request:
    branches: [main]
    paths:
      - 'dockge-deploy/**'
      - '.github/workflows/71-deploy.yml'
  push:
    branches: [main]
    paths:
      - 'dockge-deploy/**'
      - '.github/workflows/71-deploy.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: dockge-deploy-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version: '1.23.x'
          cache: false
      - name: Test
        working-directory: dockge-deploy
        run: |
          go mod download
          go test ./...
          go vet ./...
      - name: Build all platforms
        shell: bash
        working-directory: dockge-deploy
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < VERSION)"
          mkdir -p dist
          build() {
            os="$1"; arch="$2"; ext="$3"
            out="dist/dockge-deploy-${version}-${os}-${arch}${ext}"
            CGO_ENABLED=0 GOOS="$os" GOARCH="$arch" go build \
              -trimpath \
              -ldflags "-s -w -X github.com/wkarts/dockge/dockge-deploy/internal/version.Version=$version" \
              -o "$out" ./cmd/dockge-deploy
          }
          build linux amd64 ""
          build linux arm64 ""
          build windows amd64 ".exe"
          build windows arm64 ".exe"
          build darwin amd64 ""
          build darwin arm64 ""
          (cd dist && sha256sum * > SHA256SUMS.txt)
      - uses: actions/upload-artifact@v4
        with:
          name: dockge-deploy-binaries
          path: dockge-deploy/dist/*
          if-no-files-found: error
          retention-days: 30

  release:
    if: ${{ github.event_name != 'pull_request' && github.ref == 'refs/heads/main' }}
    needs: build
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          name: dockge-deploy-binaries
          path: dist
      - name: Publish independent Dockge Deploy release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          version="$(tr -d '[:space:]' < dockge-deploy/VERSION)"
          tag="dockge-deploy-v$version"
          if ! gh release view "$tag" >/dev/null 2>&1; then
            gh release create "$tag" \
              --target "$GITHUB_SHA" \
              --title "Dockge Deploy $version" \
              --notes "Binários multiplataforma do Dockge Deploy. Este release é independente do Dockge Core."
          fi
          gh release upload "$tag" dist/* --clobber

name: "🚀 Feature Request"
description: "Sugira uma evolução para wkarts/dockge"
labels: [feature-request]
body:
  - type: checkboxes
    id: duplicate
    attributes:
      label: "⚠️ Verificação"
      options:
        - label: "Pesquisei no repositório e não encontrei proposta equivalente"
          required: true
  - type: dropdown
    id: area
    attributes:
      label: "Área"
      options:
        - API / Automation
        - Generic Infrastructure Agent
        - Docker / Compose
        - UI / UX
        - Security
        - CI / Release / GHCR
        - Other
    validations:
      required: true
  - type: textarea
    id: problem
    attributes:
      label: "Problema / necessidade"
      description: "Descreva o problema antes da solução."
    validations:
      required: true
  - type: textarea
    id: proposal
    attributes:
      label: "Proposta"
      description: "Descreva o comportamento desejado."
    validations:
      required: true
  - type: textarea
    id: context
    attributes:
      label: "Contexto adicional"
    validations:
      required: false

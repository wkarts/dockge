name: "🐛 Bug Report"
description: "Reporte um bug reproduzível em wkarts/dockge"
labels: [bug]
body:
  - type: checkboxes
    id: duplicate
    attributes:
      label: "⚠️ Verificação"
      options:
        - label: "Pesquisei em https://github.com/wkarts/dockge/issues e não encontrei bug equivalente"
          required: true
        - label: "Li https://github.com/wkarts/dockge/security/policy e não estou publicando uma vulnerabilidade sensível"
          required: true
  - type: textarea
    id: description
    validations:
      required: true
    attributes:
      label: "Descrição"
      description: "Explique o problema e o impacto."
  - type: textarea
    id: steps-to-reproduce
    validations:
      required: true
    attributes:
      label: "👟 Passos para reproduzir"
  - type: textarea
    id: expected-behavior
    validations:
      required: true
    attributes:
      label: "👀 Comportamento esperado"
  - type: textarea
    id: actual-behavior
    validations:
      required: true
    attributes:
      label: "😓 Comportamento atual"
  - type: input
    id: dockge-version
    attributes:
      label: "Dockge Version"
      description: "Informe a versão SemVer; se estiver em develop, informe também o SHA."
      placeholder: "Ex. 1.6.0 / develop-abc123"
    validations:
      required: true
  - type: input
    id: operating-system
    attributes:
      label: "💻 Sistema operacional e arquitetura"
      placeholder: "Ex. Ubuntu 24.04 amd64"
    validations:
      required: true
  - type: input
    id: docker-version
    attributes:
      label: "🐋 Docker / Compose"
      placeholder: "Ex. Docker 28 / Compose v2"
    validations:
      required: true
  - type: textarea
    id: logs
    attributes:
      label: "📝 Logs relevantes"
      description: "Remova tokens, senhas, chaves, dados de clientes e outros segredos antes de enviar."
      render: shell
    validations:
      required: false
